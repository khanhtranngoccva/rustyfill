[workspace]
members = ["fallibles-macros", "xtask"]
resolver = "2"

[package]
name = "fallibles"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = { version = "6", features = ["raw-api"] }
fallibles-macros = { path = "fallibles-macros" }
hashbrown = "0.14.5"
libc = "0.2.189"
once_cell = "1.21.4"
rustversion = "1.0.23"

[target.'cfg(target_os = "motor")'.dependencies]
moto-rt = { version = "0.16", features = ['rustc-dep-of-std'] }

[target.'cfg(target_os = "hermit")'.dependencies]
hermit-abi = { version = "0.5.0", features = [
    'rustc-dep-of-std',
] }

[target.'cfg(all(target_os = "wasi", target_env = "p1"))'.dependencies]
wasip1 = { version = "1.0.0", features = [
    'rustc-dep-of-std',
], default-features = false }

[target.'cfg(all(target_os = "wasi", target_env = "p2"))'.dependencies]
wasip2 = { version = '1.0.3', features = [
    'rustc-dep-of-std',
], default-features = false }

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
wasip3 = { version = '0.7.0', features = [
    'rustc-dep-of-std',
], default-features = false }

[target.'cfg(target_os = "uefi")'.dependencies]
r-efi = { version = "5.2.0", features = ['rustc-dep-of-std'] }
r-efi-alloc = { version = "2.0.0", features = ['rustc-dep-of-std'] }

[profile.dev]
opt-level = 2

[features]
# Enables the B-tree map/set fallible wrappers which rely on `catch_unwind`.
# Requires that the crate is compiled with `panic = "unwind"` (the default).
# The build script will error if this feature is enabled but the crate is
# compiled in `panic = "abort"` mode, since `catch_unwind` cannot intercept
# aborting panics.
panic = []

[dev-dependencies]
no-panic = "0.1.37"

[build-dependencies]
cargo-build = "1.0.0"
