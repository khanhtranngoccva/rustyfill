[workspace]
# All crates live in this single workspace. Note that `rustyfill-macros`,
# `rustyfill-sys-bindings` (compile-time tooling) and `rustyfill-test-allocator`
# (test-time, std-only: its thread-local failure hooks require std) are NOT
# no_std-capable, so verification tasks that exercise the no_std configuration
# scope to the core members explicitly (`-p`) instead of using `--workspace`,
# which would force `std` back on via feature unification from those crates.
members = [
    "rustyfill",
    "rustyfill-macros",
    "rustyfill-errors",
    "rustyfill-test-allocator",
    "antipatterns",
    "xtask",
    "rustyfill-sys",
    "rustyfill-sys-bindings",
    "experiments",
]
resolver = "2"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dashmap = { version = "6", features = ["raw-api"] }
hashbrown = { version = "0.14.5", default-features = false, features = ["raw"] }
libc = "0.2.189"
once_cell = { version = "1.21.4", default-features = false }
parking_lot = { version = "0.12", default-features = false }
crossbeam-utils = { version = "0.8", default-features = false }
cfg-if = "1.0"
rustversion = "1.0.23"
rustyfill-macros = { path = "rustyfill-macros" }
quote = "1"
proc-macro2 = "1"
rustyfill = { path = "rustyfill" }
rustyfill-sys = { path = "rustyfill-sys" }
rustyfill-sys-bindings = { path = "rustyfill-sys-bindings" }
rustyfill-test-allocator = { path = "rustyfill-test-allocator" }
static_assertions = "1.1"
cargo-build = "1.0.0"
syn = { version = "2", features = ["full"] }
getrandom = { version = "0.3", default-features = false }
moto-rt = { version = "0.16", features = ["rustc-dep-of-std"] }
hermit-abi = { version = "0.5.0", features = ["rustc-dep-of-std"] }
wasip1 = { version = "1.0.0", features = ["rustc-dep-of-std"], default-features = false }
wasip2 = { version = "1.0.3", features = ["rustc-dep-of-std"], default-features = false }
wasip3 = { version = "0.7.0", features = ["rustc-dep-of-std"], default-features = false }
r-efi = { version = "5.2.0", features = ["rustc-dep-of-std"] }
r-efi-alloc = { version = "2.0.0", features = ["rustc-dep-of-std"] }

[profile.dev]
opt-level = 2
