[workspace]
members = ["fallibles-macros", "xtask"]
resolver = "2"

[package]
name = "fallibles"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = { version = "6", features = ["raw-api"] }
fallibles-macros = { path = "fallibles-macros" }
hashbrown = "0.14.5"

[profile.dev]
opt-level = 2

[dev-dependencies]
no-panic = "0.1.37"
