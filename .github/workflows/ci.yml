name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Normal tests ────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: freebsd-latest
            target: x86_64-unknown-freebsd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  # ── Miri ────────────────────────────────────────────────────────────────
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src
      - run: cargo +nightly miri test --workspace

  # ── no_std checks ───────────────────────────────────────────────────────
  no-std:
    name: no_std (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rustyfill, rustyfill-errors]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ${{ matrix.package }} compiles without std
        run: cargo check --package ${{ matrix.package }} --no-default-features
      - name: Test ${{ matrix.package }} without std
        run: cargo test --package ${{ matrix.package }} --no-default-features

  # ── CRAP complexity analysis ────────────────────────────────────────────
  crap:
    name: CRAP (complexity)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Install cargo-crap
        run: cargo install cargo-crap
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # On pushes to main, generate the baseline artifact for PRs to compare against.
      - name: Generate baseline on main
        if: github.event_name == 'push'
        run: >
          cargo crap --workspace --lcov lcov.info
          --format json --sort file --output crap-baseline.json
      - name: Upload baseline artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: crap-baseline
          path: crap-baseline.json
          retention-days: 1

      # On pull requests, download the baseline from the target branch and compare.
      - name: Download baseline from base branch
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: crap-baseline
          path: baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run CRAP regression check
        if: github.event_name == 'pull_request'
        run: >
          cargo crap --workspace --lcov lcov.info
          --baseline baseline/crap-baseline.json
          --format pr-comment --output crap-comment.md
          --fail-regression --fail-above

      - name: Post CRAP report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('crap-comment.md', 'utf8');
            const marker = '<!-- cargo-crap-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: marker + '\n' + body,
            };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }

  # ── Sanitizers ──────────────────────────────────────────────────────────
  sanitize:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [leak, address]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - env:
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort -Zsanitizer=${{ matrix.sanitizer }} -Zpanic_abort_tests"
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          --workspace --lib --tests -- --nocapture
