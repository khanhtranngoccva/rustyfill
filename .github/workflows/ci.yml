name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Formatting ──────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Normal tests ────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # No hosted FreeBSD runner exists on GitHub Actions; re-enable with a
          # self-hosted runner or vmactions/freebsd-vm if that becomes viable.
          # - os: freebsd-latest
          #   target: x86_64-unknown-freebsd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-src is declared up front so it lands in the toolchain cache
      # during setup, before any code change can invalidate the build. The
      # build script's own `rustup component add` fallback remains as a
      # safety net for local/dev machines without the component.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rust-src
      - run: cargo test --workspace --target ${{ matrix.target }}

  # ── All-features tests ──────────────────────────────────────────────────
  # Exercises every feature flag simultaneously (std + unstable + allocator-api).
  # `allocator-api` is a no-op on stable (the build script only enables the
  # real core::alloc types on nightly), so this runs on the stable toolchain.
  all-features:
    name: Test (all features, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # No hosted FreeBSD runner exists on GitHub Actions (see `test` job).
          # - os: freebsd-latest
          #   target: x86_64-unknown-freebsd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rust-src
      - run: cargo test --workspace --all-features --target ${{ matrix.target }}

  # ── Miri ────────────────────────────────────────────────────────────────
  # rust-src is declared up front (see the test job) so it is cached during
  # toolchain setup rather than fetched mid-build by the build script.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src
      # Isolation is disabled because some tests invoke real filesystem
      # syscalls (open/read/write), which Miri's isolated shim rejects.
      - env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo +nightly miri test --workspace

  # ── no_std checks ───────────────────────────────────────────────────────
  no-std:
    name: no_std (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [rustyfill, rustyfill-errors]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ${{ matrix.package }} compiles without std
        run: cargo check --package ${{ matrix.package }} --no-default-features
      - name: Test ${{ matrix.package }} without std
        run: cargo test --package ${{ matrix.package }} --no-default-features

  # ── CRAP complexity analysis ────────────────────────────────────────────
  crap:
    name: CRAP (complexity)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # rust-src up front (see the test job) so the build script finds it
      # already cached instead of downloading mid-build.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Install cargo-crap
        run: cargo install cargo-crap
      # --all-features so feature-gated code (unstable, allocator-api) is
      # compiled in and scored — otherwise those chunks are invisible to the
      # analysis and look artificially clean.
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      # On pushes to main, generate the baseline artifact for PRs to compare against.
      - name: Generate baseline on main
        if: github.event_name == 'push'
        run: >
          cargo crap --workspace --lcov lcov.info
          --format json --sort file --output crap-baseline.json
      - name: Upload baseline artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: crap-baseline
          path: crap-baseline.json
          retention-days: 7

      # Generate the shields.io endpoint JSON for the README badge on main.
      # Runs before the regression gate below so a failing gate still
      # publishes an up-to-date (yellow/red) badge instead of a stale one.
      - name: Generate CRAP badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          cargo crap --workspace --lcov lcov.info
          --format shields --output crap-badge.json

      - name: Upload CRAP badge artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: crap-badge
          path: crap-badge.json

      # On pull requests, download the baseline from the target branch and compare.
      - name: Download baseline from base branch
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: crap-baseline
          path: baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Run CRAP regression check
        if: github.event_name == 'pull_request'
        run: >
          cargo crap --workspace --lcov lcov.info
          --baseline baseline/crap-baseline.json
          --format pr-comment --output crap-comment.md
          --fail-regression --fail-above

      - name: Post CRAP report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('crap-comment.md', 'utf8');
            const marker = '<!-- cargo-crap-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: marker + '\n' + body,
            };
            if (existing) {
              await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });
            }

  # ── CRAP badge publication ──────────────────────────────────────────────
  # Publishes the shields.io endpoint JSON generated by the crap job to an
  # orphan `badges` branch, which the README embeds via img.shields.io.
  # Kept separate from crap so `contents: write` is scoped to this one job,
  # and it only ever runs on pushes to main.
  badge:
    name: Publish CRAP badge
    needs: [crap]
    # always() + result filter: publish on crap success *and* failure (a
    # failing gate is exactly when the badge must turn yellow/red), but not
    # when crap was skipped.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && contains(fromJSON('["success", "failure"]'), needs.crap.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The artifact is missing when crap failed before generating it
      # (e.g. a broken coverage build) — skip publishing then.
      - name: Download CRAP badge artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: crap-badge
          path: .
        continue-on-error: true
      # Build a single-file orphan commit with git plumbing and force-push it
      # to `badges` — no checkout dance, and the branch never accumulates
      # history.
      - name: Push CRAP badge to the badges branch
        run: |
          if [ ! -f crap-badge.json ]; then
            echo "No badge artifact — crap failed before generating it; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w crap-badge.json)
          tree=$(printf '100644 blob %s\tcrap-badge.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore: update CRAP badge")
          git push --force origin "$commit:refs/heads/badges"

  # ── Sanitizers ──────────────────────────────────────────────────────────
  sanitize:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [leak, address]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - env:
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort -Zsanitizer=${{ matrix.sanitizer }} -Zpanic_abort_tests"
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          --workspace --lib --tests -- --nocapture
