[package]
name = "rustyfill-errors"
version.workspace = true
edition = "2024"

# Context-aware error handling with frame stacks inspired by error-stack,
# optimized for OOM resilience — the tail of dynamic frames can be discarded
# if allocation fails while building a report.

[features]
default = ["std"]
std = ["rustyfill/std"]

[dependencies]
rustyfill = { workspace = true }

[dev-dependencies]
rustyfill-test-allocator = { workspace = true }

[build-dependencies]
cargo-build = { workspace = true }
