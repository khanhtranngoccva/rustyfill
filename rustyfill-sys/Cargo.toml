[package]
name = "rustyfill-sys"
version.workspace = true
edition = "2024"

[lib]
# The actual library code lives in OUT_DIR, generated by build.rs.
# This file just re-exports everything as public.
path = "src/lib.rs"

[dependencies]
libc = "0.2"

[features]
nightly = []
std = []
# Emits `#[rustyfill_drop = "yes" | "maybe-no"]` annotations on struct/enum/
# union fields so downstream crates know which fields carry real drop glue.
# Works on stable — no compiler feature required.
drop-annotations = []

[build-dependencies]
rustyfill-sys-bindings = { path = "../rustyfill-sys-bindings" }
